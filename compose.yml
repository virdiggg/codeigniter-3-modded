
services:
  app:
    build:
      context: .
      dockerfile: Containerfile

    container_name: ci3-mod

    user: root

    volumes:
      - .:/app:z

    environment:
      REDIS_SCHEME: tcp
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - redis

  web:
    image: docker.io/library/caddy:latest

    ports:
      - "8074:80"

    volumes:
      - .:/app:z
      - ./Caddyfile:/etc/caddy/Caddyfile:z

    depends_on:
      - app

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ci3-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  redis_data:
